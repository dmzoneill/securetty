static_resources:
  listeners:
    # ─────────────────────────────────────────────────
    # HTTPS/TLS catch-all (port 443) — SNI-based domain filtering
    # Inspects TLS ClientHello SNI, checks against allowed domains.
    # No SSL termination — pure TCP passthrough.
    # ─────────────────────────────────────────────────
    - name: tls_passthrough
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 443
      listener_filters:
        - name: envoy.filters.listener.tls_inspector
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
      filter_chains:
        - filter_chain_match:
            server_names:
              - "*.anthropic.com"
              - "anthropic.com"
              - "*.claude.ai"
              - "claude.ai"
              - "*.claude.com"
              - "claude.com"
              - "*.claudeusercontent.com"
              - "claudeusercontent.com"
              - "*.openai.com"
              - "openai.com"
              - "*.chatgpt.com"
              - "chatgpt.com"
              - "*.oaistatic.com"
              - "oaistatic.com"
              - "*.googleapis.com"
              - "googleapis.com"
              - "*.google.com"
              - "google.com"
              - "*.aistudio.google.com"
              - "aistudio.google.com"
              - "*.cursor.sh"
              - "cursor.sh"
              - "*.cursor.com"
              - "cursor.com"
              - "*.cursorapi.com"
              - "cursorapi.com"
              - "*.cursor-cdn.com"
              - "cursor-cdn.com"
              - "*.todesktop.com"
              - "todesktop.com"
              - "*.kiro.dev"
              - "kiro.dev"
              - "*.amazonaws.com"
              - "amazonaws.com"
              - "*.x.ai"
              - "x.ai"
              - "*.sourcegraph.com"
              - "sourcegraph.com"
              - "*.ampcode.com"
              - "ampcode.com"
              - "*.cline.bot"
              - "cline.bot"
              - "*.openrouter.ai"
              - "openrouter.ai"
              - "*.moonshot.cn"
              - "moonshot.cn"
              - "*.kimi.com"
              - "kimi.com"
              - "*.moonshotai.com"
              - "moonshotai.com"
