  - make
  - gcc
  - g++
  - findutils
  - procps-ng
  - which
  - openssh-clients
  - gnupg2
  - unzip
  - tar
  - xz
  - gnome-shell
  - mutter-devkit
  - dbus-daemon
  - dbus-tools
  - glib2
  - glib2-devel
  - gsettings-desktop-schemas
  - mesa-dri-drivers
  - mesa-libEGL
  - xdg-utils
  - socat
