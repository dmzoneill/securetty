---
# =============================================================================
# securetty configuration
# =============================================================================

securetty_user: daoneill
securetty_home: "/home/{{ securetty_user }}"
securetty_dir: "{{ securetty_home }}/src/securetty"
securetty_fedora_version: 45
securetty_quarantine_days: 7
securetty_ssh_key: dmzoneill-2024
securetty_ssh_keys:
  - dmzoneill-2024
  - id_ecdsa
securetty_podman_cmd: "podman"
securetty_compose_cmd: "podman-compose"

# Network
securetty_network_name: "securetty"
securetty_subnet: "10.89.100.0/24"
securetty_gateway: "10.89.100.1"
securetty_bridge_interface: "securetty0"

# CIDR ranges for cloud providers with wildcard domains
# Google Cloud / googleapis (Vertex AI, OAuth, storage, aiplatform)
securetty_allowed_cidrs:
  - "142.250.0.0/15"
  - "142.251.0.0/16"
  - "172.217.0.0/16"
  - "172.253.0.0/16"
  - "216.58.0.0/16"
  - "74.125.0.0/16"
  - "173.194.0.0/16"
  - "64.233.160.0/19"
  - "66.102.0.0/20"
  - "108.177.0.0/17"
  - "209.85.128.0/17"
  - "35.190.0.0/16"
  - "35.191.0.0/16"
  # GitHub
  - "140.82.112.0/20"
  - "192.30.252.0/22"
  - "185.199.108.0/22"
  # AWS (for amazonaws.com services — Kiro, GitLab ELB)
  - "3.0.0.0/8"
  - "52.0.0.0/8"
  - "54.0.0.0/8"
  - "18.0.0.0/8"

# =============================================================================
# API keys (pass paths)
# =============================================================================

securetty_pass_keys:
  - { var: AI_API_KEY, path: "openai.com/key" }
  - { var: GEMINI_API_KEY, path: "google.com/ai-studio" }
  - { var: MISTRAL_API_KEY, path: "mistral.ai/key" }
  - { var: OPENROUTER_API_KEY, path: "openrouter.ai/key" }
  - { var: GROQ_API_KEY, path: "groq.com/key" }
  - { var: CEREBRAS_API_KEY, path: "cerebras.ai/key" }
  - { var: SAMBANOVA_API_KEY, path: "sambanova.ai/key" }
  - { var: GITHUB_TOKEN, path: "github.com/profile-readme" }
  - { var: OMNIROUTE_API_KEY, path: "omniroute.ai/key" }
  - { var: OMNIROUTE_INITIAL_PASSWORD, path: "omniroute.ai/dashboard-password" }
  - { var: CLOUDFLARE_AI_TOKEN, path: "cloudflare.com/key-claude" }
  - { var: GITLAB_TOKEN, path: "redhat.com/gitlab-notifier" }
  - { var: JIRA_JPAT, path: "redhat.com/jira-ticket-closer" }
  - { var: JIRA_URL, path: "bashrc.d/jira-url" }
  - { var: JIRA_PROJECT_KEY, path: "bashrc.d/jira-project-key" }
  - { var: JIRA_BOARD_ID, path: "bashrc.d/jira-board-id" }
  - { var: JIRA_EMAIL, path: "bashrc.d/jira-email" }
  - { var: JIRA_COMPONENT_NAME, path: "bashrc.d/jira-component" }
  - { var: SLACK_HOST, path: "bashrc.d/slack-host" }
  - { var: WORDPRESS_URL, path: "bashrc.d/wordpress-url" }
  - { var: WORDPRESS_USERNAME, path: "bashrc.d/wordpress-username" }
  - { var: WORDPRESS_PASSWORD, path: "feeditout.com/dave" }
  - { var: WORDPRESS_APPLICATION, path: "feeditout.com/wp-application" }

securetty_key_aliases:
  - { var: OPENAI_API_KEY, source: AI_API_KEY }
  - { var: GITLAB_API_TOKEN, source: GITLAB_TOKEN }
  - { var: JIRA_AI_API_KEY, source: AI_API_KEY }

# Static env vars (not secrets — hardcoded config values)
securetty_static_env:
  JIRA_EPIC_FIELD: "customfield_10014"
  JIRA_EPIC_NAME_FIELD: "customfield_10011"
  JIRA_STORY_POINTS_FIELD: "customfield_10028"
  JIRA_SPRINT_FIELD: "customfield_10020"
  JIRA_ACCEPTANCE_CRITERIA_FIELD: "customfield_10718"
  JIRA_BLOCKED_FIELD: "customfield_10517"
  JIRA_BLOCKED_REASON_FIELD: "customfield_10483"
  JIRA_WORKSTREAM_FIELD: "customfield_10681"
  JIRA_WORKSTREAM_VALUE: "Cloud Automation Analytics"
  JIRA_PRIORITY: "Normal"
  JIRA_AFFECTS_VERSION: "aa-latest"
  JIRA_AI_PROVIDER: "vertex"
  JIRA_AI_MODEL: "claude-sonnet-4-6@20250514"

securetty_vertex_vars:
  - CLAUDE_CODE_USE_VERTEX
  - ANTHROPIC_VERTEX_PROJECT_ID
  - GOOGLE_CLOUD_PROJECT
  - GOOGLE_CLOUD_LOCATION
  - CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC

# =============================================================================
# OmniRoute providers
# =============================================================================

securetty_providers:
  - { id: openai, name: OpenAI, key_var: OPENAI_API_KEY, priority: 100, model: "gpt-4o" }
  - { id: gemini, name: "Google AI Studio", key_var: GEMINI_API_KEY, priority: 100, model: "gemini-2.5-flash" }
  - { id: mistral, name: Mistral, key_var: MISTRAL_API_KEY, priority: 100, model: "mistral-large-latest" }
  - { id: openrouter, name: OpenRouter, key_var: OPENROUTER_API_KEY, priority: 50, model: "" }
  - { id: groq, name: Groq, key_var: GROQ_API_KEY, priority: 50, model: "llama-3.3-70b-versatile" }
  - { id: cerebras, name: Cerebras, key_var: CEREBRAS_API_KEY, priority: 50, model: "" }
  - { id: sambanova, name: SambaNova, key_var: SAMBANOVA_API_KEY, priority: 50, model: "" }

# =============================================================================
# AI agents installed in container
# =============================================================================

securetty_npm_agents:
  - "@anthropic-ai/claude-code"
  - "@openai/codex"
  - "@google/gemini-cli"
  - "@cursor/cli"
  - cline
  - opencode-ai
  - "@ampcode/cli"
  - "@kilocode/cli"
  - "@earendil-works/pi-ai"

securetty_pip_agents:
  - aider-chat
  - openhands
  - kimi-cli

securetty_binary_agents:
  - { name: goose, repo: "block/goose", install: "curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh | GOOSE_BIN=/usr/local/bin bash" }
  - { name: grok-build, repo: "xai-org/grok-build", install: "curl -fsSL https://x.ai/cli/install.sh | bash && ([ -f /root/.local/bin/grok ] && mv /root/.local/bin/grok /usr/local/bin/grok || true)" }
  - { name: forge, repo: "anthropics/claude-code", install: "curl -fsSL https://forgecode.dev/cli | sh && ([ -f /root/.local/bin/forge ] && mv /root/.local/bin/forge /usr/local/bin/forge || true)" }
  - { name: kiro-cli, repo: "aws/amazon-q-developer-cli", install: "curl -fsSL https://cli.kiro.dev/install | bash && ([ -f /root/.local/bin/kiro-cli ] && mv /root/.local/bin/kiro-cli /usr/local/bin/kiro-cli || true)" }
  - { name: jcode, repo: "1jehuang/jcode", install: "curl -fsSL https://raw.githubusercontent.com/1jehuang/jcode/master/scripts/install.sh | bash" }

# Agent aliases (personal + work modes)
securetty_agents:
  - { name: claude, skip: "--dangerously-skip-permissions", short: c, work: true }
  - { name: codex, skip: "--dangerously-bypass-approvals-and-sandbox", short: cx, work: true }
  - { name: gemini, skip: "", short: gm, work: true }
  - { name: cursor, skip: "--yolo", short: cr, work: true }
  - { name: cline, skip: "--yolo", short: cl, work: true }
  - { name: opencode, skip: "", short: ocd, work: true }
  - { name: amp, skip: "", short: "", work: true }
  - { name: kilo, skip: "", short: "", work: true }
  - { name: aider, skip: "--yes", short: ai, work: true }
  - { name: openhands, skip: "", short: oh, work: true }
  - { name: goose, skip: "", short: gs, work: true }
  - { name: grok, skip: "", short: gr, work: true }
  - { name: forge, skip: "", short: fg, work: true }
  - { name: kiro-cli, skip: "", short: ki, work: true }
  - { name: pi-ai, skip: "", short: pi, work: true }
  - { name: kimi, skip: "", short: km, work: true }
  - { name: jcode, skip: "", short: jc, work: true }

# =============================================================================
# Ollama models
# =============================================================================

securetty_ollama_models:
  - qwen3:8b
  - qwen3:32b
  - deepseek-coder-v2:16b

# =============================================================================
# Egress allowed domains (Envoy SNI allowlist)
# =============================================================================

securetty_allowed_domains:
  # AI provider APIs
  - "*.anthropic.com"
  - "*.claude.ai"
  - "*.claude.com"
  - "*.claudeusercontent.com"
  - "*.openai.com"
  - "*.chatgpt.com"
  - "*.oaistatic.com"
  - "*.googleapis.com"
  - "*.google.com"
  - "*.aistudio.google.com"
  - "*.cursor.sh"
  - "*.cursor.com"
  - "*.cursorapi.com"
  - "*.cursor-cdn.com"
  - "*.todesktop.com"
  - "*.kiro.dev"
  - "*.amazonaws.com"
  - "*.x.ai"
  - "*.sourcegraph.com"
  - "*.ampcode.com"
  - "*.cline.bot"
  - "*.openrouter.ai"
  - "*.moonshot.cn"
  - "*.kimi.com"
  - "*.moonshotai.com"
  # Git hosting
  - "*.github.com"
  - "*.githubusercontent.com"
  - "*.github.io"
  - "*.githubcopilot.com"
  - "*.gitlab.com"
  - "*.gitlab.cee.redhat.com"
  # Package registries
  - "*.npmjs.org"
  - "*.npmjs.com"
  - "*.yarnpkg.com"
  - "*.pypi.org"
  - "*.pythonhosted.org"
  - "*.crates.io"
  - "*.astral.sh"
  # Container registries
  - "*.quay.io"
  - "*.docker.io"
  - "*.docker.com"
  - "*.registry.fedoraproject.org"
  - "*.ghcr.io"
  # Red Hat
  - "*.redhat.com"
  # Cloud providers
  - "*.cloud.google.com"
  # Sigstore
  - "*.sigstore.dev"
  # Ollama models
  - "*.ollama.com"
  - "*.ollama.ai"
  # Jira
  - "*.atlassian.net"
  - "*.atlassian.com"
  # Slack
  - "*.slack.com"
  - "*.enterprise.slack.com"
  # WordPress
  - "*.feeditout.com"
  # Stripe (Kiro billing)
  - "*.stripe.com"

# =============================================================================
# Host config dirs mounted into containers
# =============================================================================

securetty_agent_config_dirs:
  - .claude
  - .codex
  - .gemini
  - .cursor
  - .kiro
  - .cline
  - .config/opencode
  - .local/share/opencode
  - .openhands
  - .config/goose
  - .grok
  - .forge
  - .amp
  - .config/kilo
  - .aider
  - .config/gcloud

# =============================================================================
# Container resource limits
# =============================================================================

securetty_resources:
  dev: { cpus: "4", memory: "8G" }
  omniroute: { cpus: "2", memory: "1G" }
  headroom: { cpus: "1", memory: "512M" }
  cloudcli: { cpus: "2", memory: "1G" }
  ollama: { cpus: "4", memory: "16G" }

# =============================================================================
# System packages for dev container
# =============================================================================

securetty_dnf_packages:
