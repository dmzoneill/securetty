  - google-api-python-client
  - google-auth-oauthlib

# =============================================================================
# Migration targets
# =============================================================================

securetty_npm_remove:
  - "@anthropic-ai/claude-code"
  - "@openai/codex"
  - "@google/gemini-cli"
  - "@cloudcli-ai/cloudcli"
  - deepseek-cli
  - task-master-ai
  - omniroute
  - sass

securetty_pip_remove:
  - anthropic
  - litellm
  - litellm-enterprise
  - litellm-proxy-extras
  - openai
  - sentence-transformers
  - headroom-ai

securetty_binaries_remove:
  - "{{ securetty_home }}/bin/cursor"
  - "{{ securetty_home }}/.local/bin/claude"
  - "{{ securetty_home }}/.local/bin/kiro-cli"
  - "{{ securetty_home }}/.local/bin/kiro-cli-chat"
  - "{{ securetty_home }}/.local/bin/kiro-cli-term"
  - "{{ securetty_home }}/.local/bin/opencode-bash-wrapper"
  - "{{ securetty_home }}/.local/bin/opencode-launcher"
  - "{{ securetty_home }}/.local/bin/opencode-web"
  - "{{ securetty_home }}/.local/bin/claude-auto-format.sh"
  - "{{ securetty_home }}/.local/bin/claude-post-commit-hook.sh"
  - "{{ securetty_home }}/.local/bin/cursor-agent"
  - "{{ securetty_home }}/.local/bin/cursor-pre-commit-hook.sh"
  - "{{ securetty_home }}/.local/bin/headroom"

securetty_services_disable:
  - { name: cloudcli, scope: user }
  - { name: ollama, scope: system }

securetty_rpms_remove:
  - cursor
