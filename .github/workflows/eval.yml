name: Eval

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'evals/**'
      - 'roles/containers/files/workflows.toon'

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install promptfoo
        run: npm install -g promptfoo

      - name: Run skill quality evals
        run: npx promptfoo eval --config evals/skill-quality.yaml --output evals/results.json

      - name: Check pass rate
        run: |
          pass_rate=$(jq '.results.stats.successes / .results.stats.total' evals/results.json)
          echo "Pass rate: $pass_rate"
          if (( $(echo "$pass_rate < 0.8" | bc -l) )); then
            echo "FAIL: pass rate below 80% threshold"
            exit 1
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results.json
