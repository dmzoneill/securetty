---
- name: Ensure nftables is installed
  ansible.builtin.dnf:
    name: nftables
    state: present
  become: true
  tags: [egress]

- name: Ensure egress directory exists
  ansible.builtin.file:
    path: "{{ securetty_dir }}/egress"
    state: directory
    mode: "0755"
  tags: [egress]

- name: Template nftables ruleset
  ansible.builtin.template:
    src: securetty-nftables.conf.j2
    dest: "{{ securetty_dir }}/egress/securetty-nftables.conf"
    mode: "0644"
  tags: [egress]

- name: Template IP resolver script
  ansible.builtin.template:
    src: update-egress-ips.sh.j2
    dest: "{{ securetty_dir }}/egress/update-egress-ips.sh"
    mode: "0755"
  tags: [egress]

- name: Load nftables ruleset
  ansible.builtin.shell: |
    nft -f {{ securetty_dir }}/egress/securetty-nftables.conf
  become: true
  changed_when: true
  tags: [egress]

- name: Run initial IP resolution
  ansible.builtin.shell: |
    {{ securetty_dir }}/egress/update-egress-ips.sh
  become: true
  changed_when: true
  tags: [egress]

- name: Add NAT masquerade for container bridge to VPN
  ansible.builtin.shell: |
    nft add rule ip nat POSTROUTING ip saddr {{ securetty_internal_subnet }} oifname "wt0" masquerade 2>/dev/null || true
  become: true
  changed_when: true
  tags: [egress]
