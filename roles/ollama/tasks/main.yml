---
- name: Wait for ollama to be healthy
  ansible.builtin.uri:
    url: http://localhost:11434/
    method: GET
    status_code: 200
  register: ollama_health
  until: ollama_health.status == 200
  retries: 30
  delay: 5
  tags:
    - ollama

- name: Get existing ollama models
  ansible.builtin.uri:
    url: http://localhost:11434/api/tags
    method: GET
    status_code: 200
  register: ollama_existing_models
  tags:
    - ollama

- name: Pull missing ollama models (background)
  ansible.builtin.shell: |
    {{ securetty_podman_cmd }} exec -d securetty-ollama ollama pull {{ item }}
  loop: "{{ securetty_ollama_models }}"
  when: item not in (ollama_existing_models.json.models | default([]) | map(attribute='name') | list)
  changed_when: true
  ignore_errors: true
  tags:
    - ollama

- name: Show model pull status
  ansible.builtin.debug:
    msg: "Models pulling in background. Check: podman exec securetty-ollama ollama list"
  tags:
    - ollama
