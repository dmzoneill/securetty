---
# containers role — build and run all securetty container images via podman-compose

# 1. Create build directories
- name: Create container build directories
  ansible.builtin.file:
    path: "{{ securetty_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - base
    - devbase
    - omniroute
    - headroom
    - cloudcli
    - ollama
    - guarddog
    - guarddog/scripts
    - osv-scanner
    - osv-scanner/scripts
    - mcp
    - creds
    - creds/scripts
    - scripts

# 2. Template all Containerfiles to their build dirs
- name: Template base Containerfile
  ansible.builtin.template:
    src: Containerfile.base.j2
    dest: "{{ securetty_dir }}/base/Containerfile"
    mode: "0644"
  register: base_containerfile

- name: Template devbase Containerfile
  ansible.builtin.template:
    src: Containerfile.devbase.j2
    dest: "{{ securetty_dir }}/devbase/Containerfile"
    mode: "0644"
  register: devbase_containerfile

- name: Template dev Containerfile
  ansible.builtin.template:
    src: Containerfile.dev.j2
    dest: "{{ securetty_dir }}/Containerfile"
    mode: "0644"

- name: Template omniroute Containerfile
  ansible.builtin.template:
    src: Containerfile.omniroute.j2
    dest: "{{ securetty_dir }}/omniroute/Containerfile"
    mode: "0644"

- name: Template headroom Containerfile
  ansible.builtin.template:
    src: Containerfile.headroom.j2
    dest: "{{ securetty_dir }}/headroom/Containerfile"
    mode: "0644"

- name: Template cloudcli Containerfile
  ansible.builtin.template:
    src: Containerfile.cloudcli.j2
    dest: "{{ securetty_dir }}/cloudcli/Containerfile"
    mode: "0644"

- name: Template ollama Containerfile
  ansible.builtin.template:
    src: Containerfile.ollama.j2
    dest: "{{ securetty_dir }}/ollama/Containerfile"
    mode: "0644"

- name: Template guarddog Containerfile
  ansible.builtin.template:
    src: Containerfile.guarddog.j2
    dest: "{{ securetty_dir }}/guarddog/Containerfile"
    mode: "0644"

- name: Template osv-scanner Containerfile
  ansible.builtin.template:
    src: Containerfile.osv-scanner.j2
    dest: "{{ securetty_dir }}/osv-scanner/Containerfile"
    mode: "0644"

- name: Template MCP Containerfile
  ansible.builtin.template:
    src: Containerfile.mcp.j2
    dest: "{{ securetty_dir }}/mcp/Containerfile"
    mode: "0644"

- name: Template creds Containerfile
  ansible.builtin.template:
    src: Containerfile.creds.j2
    dest: "{{ securetty_dir }}/creds/Containerfile"
    mode: "0644"

- name: Copy credential proxy server
  ansible.builtin.copy:
    src: creds-server.py
    dest: "{{ securetty_dir }}/creds/scripts/creds-server.py"
    mode: "0755"
  tags:
    - build

- name: Template credentials config
  ansible.builtin.template:
    src: credentials.json.j2
    dest: "{{ securetty_dir }}/credentials.json"
    mode: "0600"

- name: Copy credential helper scripts to build context
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ securetty_dir }}/scripts/{{ item }}"
    mode: "0755"
  loop:
    - git-credential-securetty
    - glab-wrapper
    - gh-wrapper
  tags:
    - build

- name: Copy scanner watch scripts
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ securetty_dir }}/{{ item.dest }}"
    mode: "0755"
  loop:
    - { src: guarddog-watch.sh, dest: guarddog/scripts/guarddog-watch.sh }
    - { src: osv-watch.sh, dest: osv-scanner/scripts/osv-watch.sh }
  tags:
    - build

# 3. Template podman-compose.yml
- name: Template podman-compose.yml
  ansible.builtin.template:
    src: podman-compose.yml.j2
    dest: "{{ securetty_dir }}/podman-compose.yml"
    mode: "0644"

# 5. Copy static files to scripts/
- name: Copy static scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ securetty_dir }}/scripts/{{ item }}"
    mode: "0755"
  loop:
    - entrypoint.sh
    - install.sh
    - xdg-open
    - open-relay-host.sh
    - headroom-entrypoint.sh
  tags:
    - build

- name: Template install-delayed.sh
  ansible.builtin.template:
    src: install-delayed.sh.j2
    dest: "{{ securetty_dir }}/scripts/install-delayed.sh"
    mode: "0755"
  tags:
    - build

- name: Copy Red Hat CA to devbase build dir
  ansible.builtin.copy:
    src: /etc/pki/ca-trust/extracted/pem/directory-hash/Red_Hat_IT_Root_CA.pem
    dest: "{{ securetty_dir }}/devbase/redhatter-ca.crt"
    mode: "0644"
    remote_src: true
  tags:
    - build

- name: Copy headroom entrypoint to build dir
  ansible.builtin.copy:
    src: headroom-entrypoint.sh
    dest: "{{ securetty_dir }}/headroom/entrypoint.sh"
    mode: "0755"
  tags:
    - build

- name: Template omniroute install.sh from source
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      set -euo pipefail

      QUARANTINE_DAYS="${QUARANTINE_DAYS:-7}"
      CUTOFF_EPOCH=$(date -u -d "${QUARANTINE_DAYS} days ago" +%s)
      PKG="omniroute"

      echo "=== Installing $PKG (>= ${QUARANTINE_DAYS}d old) ==="

      time_json=$(npm view "$PKG" time --json 2>/dev/null || echo "{}")
      best_version=$(echo "$time_json" | jq -r --argjson cutoff "$CUTOFF_EPOCH" '
          to_entries
          | map(select(.key != "created" and .key != "modified"))
          | map(select((.value | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) <= $cutoff))
          | sort_by(.value) | reverse | .[0].key // empty
      ' 2>/dev/null || echo "")

      if [ -n "$best_version" ]; then
          echo "Installing $PKG@$best_version"
          npm install -g "${PKG}@${best_version}"
      else
          echo "No version older than ${QUARANTINE_DAYS}d, installing latest"
          npm install -g "$PKG"
      fi

      npm cache clean --force 2>/dev/null || true
    dest: "{{ securetty_dir }}/omniroute/install.sh"
    mode: "0755"

# 7. Build containers (only when templates changed)

# Build base image first — all service images depend on it
- name: Check if base image needs rebuilding
  ansible.builtin.shell: |
    {{ securetty_podman_cmd }} image exists securetty_base 2>/dev/null && echo "exists" || echo "missing"
  register: base_image_exists
  changed_when: false
  tags:
    - build

- name: Build base image
  ansible.builtin.shell: |
    cd {{ securetty_dir }}
    {{ securetty_podman_cmd }} build -t securetty_base -f base/Containerfile base/
  when: >
    (not (securetty_skip_devbase | default(false) | bool))
    and (base_image_exists.stdout == "missing"
         or (securetty_force_rebuild | default(false) | bool))
  tags:
    - build

- name: Check if devbase image needs rebuilding
  ansible.builtin.shell: |
    {{ securetty_podman_cmd }} image exists securetty_devbase 2>/dev/null && echo "exists" || echo "missing"
  register: devbase_image_exists
  changed_when: false
  tags:
    - build

- name: Build devbase image
  ansible.builtin.shell: |
    cd {{ securetty_dir }}
    {{ securetty_podman_cmd }} build -t securetty_devbase -f devbase/Containerfile devbase/
  when: >
    (not (securetty_skip_devbase | default(false) | bool))
    and (devbase_image_exists.stdout == "missing"
         or (securetty_force_rebuild | default(false) | bool))
  tags:
    - build

- name: Check if service images need rebuilding
  ansible.builtin.shell: |
    {{ securetty_podman_cmd }} image exists securetty_dev 2>/dev/null && echo "exists" || echo "missing"
  register: images_exist
  changed_when: false
  tags:
    - build

- name: Build dev image only
  ansible.builtin.shell: |
    cd {{ securetty_dir }}
    {{ securetty_compose_cmd }} build dev
  when: >
    (securetty_dev_only | default(false) | bool)
    and (images_exist.stdout == "missing" or (securetty_force_rebuild | default(false) | bool))
  tags:
    - build

- name: Build all service images
  ansible.builtin.shell: |
    cd {{ securetty_dir }}
    {{ securetty_compose_cmd }} build
  when: >
    (not (securetty_dev_only | default(false) | bool))
    and (images_exist.stdout == "missing" or (securetty_force_rebuild | default(false) | bool))
  tags:
    - build

# 8. Generate .env files
- name: Generate .env files
  ansible.builtin.shell: |
    cd {{ securetty_dir }}
    ./scripts/generate-env.sh
  args:
    creates: "{{ securetty_dir }}/.env.omniroute"

# 9. Start SSH agent
- name: Start restricted SSH agent
  ansible.builtin.shell: |
    {{ securetty_dir }}/scripts/ssh-agent-restricted.sh start
  args:
    creates: /run/user/{{ securetty_uid }}/securetty-ssh-agent.sock

# 10. Start URL relay
- name: Start URL relay daemon
  ansible.builtin.shell: |
    nohup {{ securetty_dir }}/scripts/open-relay-host.sh start &
  args:
    creates: /run/user/{{ securetty_uid }}/securetty-open.sock

# 11. Create securetty network (must exist before compose up)
- name: Create securetty network
  ansible.builtin.shell: |
    {{ securetty_podman_cmd }} network create {{ securetty_network_name }} \
      --driver bridge \
      --subnet {{ securetty_subnet }} \
      --gateway {{ securetty_gateway }} \
      --interface-name {{ securetty_bridge_interface }} \
      --dns 169.254.1.1 \
      --ignore
  changed_when: false
  tags:
    - up

# 11b. Verify all agent binaries exist in dev image
- name: Verify agent binaries in dev image
  ansible.builtin.shell: |
    MISSING=""
    for bin in {{ securetty_agents | map(attribute='name') | join(' ') }}; do
      {{ securetty_podman_cmd }} run --rm securetty_dev which $bin >/dev/null 2>&1 || MISSING="$MISSING $bin"
    done
    if [ -n "$MISSING" ]; then
      echo "WARNING: Missing agents:$MISSING"
    else
      echo "All {{ securetty_agents | length }} agents verified"
    fi
  register: agent_verify
  changed_when: false
  tags:
    - build

- name: Show agent verification
  ansible.builtin.debug:
    msg: "{{ agent_verify.stdout }}"
  tags:
    - build

# 12. Stop existing containers
- name: Stop existing containers
  ansible.builtin.shell: |
    cd {{ securetty_dir }}
    {{ securetty_compose_cmd }} down 2>/dev/null || true
  tags:
    - up
  changed_when: true

# 12. Start containers fresh
- name: Start all containers
  ansible.builtin.shell: |
    cd {{ securetty_dir }}
    {{ securetty_compose_cmd }} up -d --no-build
  tags:
    - up
