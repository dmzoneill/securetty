---
# prereqs — ensure host prerequisites are in place before container build

- name: Set user UID/GID facts
  ansible.builtin.set_fact:
    securetty_uid: "{{ ansible_facts['user_uid'] }}"
    securetty_gid: "{{ ansible_facts['user_gid'] }}"
  tags: [prereqs]

- name: Ensure podman is installed
  ansible.builtin.dnf:
    name:
      - podman
      - podman-compose
    state: present
  become: true
  tags: [prereqs]

- name: Create agent config directories
  ansible.builtin.file:
    path: "{{ securetty_home }}/{{ item }}"
    state: directory
    owner: "{{ securetty_user }}"
    mode: "0755"
  loop: "{{ securetty_agent_config_dirs }}"
  tags: [prereqs]

- name: Create ~/.claude.json if missing
  ansible.builtin.file:
    path: "{{ securetty_home }}/.claude.json"
    state: touch
    owner: "{{ securetty_user }}"
    mode: "0600"
    modification_time: preserve
    access_time: preserve
  tags: [prereqs]

- name: Ensure MCP servers registered in ~/.claude.json
  ansible.builtin.script:
    cmd: |
      python3 -c "
      import json, os, sys
      path = os.path.expanduser('{{ securetty_home }}/.claude.json')
      try:
          with open(path) as f:
              d = json.load(f)
      except (json.JSONDecodeError, FileNotFoundError):
          d = {}
      if 'mcpServers' not in d:
          d['mcpServers'] = {}
      servers = {
          'jira': {'type': 'http', 'url': 'https://securetty-mcp-jira:8801/mcp'},
          'gitlab': {'type': 'http', 'url': 'https://securetty-mcp-gitlab:8802/mcp'},
          'github': {'type': 'http', 'url': 'https://securetty-mcp-github:8803/mcp'},
          'slack': {'type': 'http', 'url': 'https://securetty-mcp-slack:8804/mcp'},
          'wordpress': {'type': 'http', 'url': 'https://securetty-mcp-wordpress:8805/mcp'},
          'headroom': {'type': 'http', 'url': 'http://securetty-headroom:8788/mcp'},
      }
      changed = False
      for name, cfg in servers.items():
          if name not in d['mcpServers'] or d['mcpServers'][name].get('url') != cfg['url']:
              d['mcpServers'][name] = cfg
              changed = True
      if changed:
          with open(path, 'w') as f:
              json.dump(d, f, indent=2)
          print('CHANGED')
      else:
          print('OK')
      "
  register: prereqs_mcp_result
  changed_when: "'CHANGED' in prereqs_mcp_result.stdout"
  tags: [prereqs]

- name: Validate SSH key exists
  ansible.builtin.stat:
    path: "{{ securetty_home }}/.ssh/{{ securetty_ssh_key }}"
  register: prereqs_ssh_key_stat
  tags: [prereqs]

- name: Fail if SSH key is missing
  ansible.builtin.fail:
    msg: "SSH key not found: {{ securetty_home }}/.ssh/{{ securetty_ssh_key }}"
  when: not prereqs_ssh_key_stat.stat.exists
  tags: [prereqs]

- name: Validate pass entries exist
  ansible.builtin.shell: "pass show '{{ item.path }}' >/dev/null 2>&1"
  loop: "{{ securetty_pass_keys }}"
  loop_control:
    label: "{{ item.var }}"
  register: prereqs_pass_results
  changed_when: false
  failed_when: false
  no_log: true
  tags: [prereqs]

- name: Warn about missing pass entries
  ansible.builtin.debug:
    msg: "WARNING: pass entry '{{ item.item.path }}' for {{ item.item.var }} is missing or unreadable"
  loop: "{{ prereqs_pass_results.results }}"
  loop_control:
    label: "{{ item.item.var }}"
  when: item.rc != 0
  no_log: true
  tags: [prereqs]
