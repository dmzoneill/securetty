---
# prereqs — ensure host prerequisites are in place before container build

- name: Set user UID/GID facts
  ansible.builtin.set_fact:
    securetty_uid: "{{ ansible_facts['user_uid'] }}"
    securetty_gid: "{{ ansible_facts['user_gid'] }}"
  tags: [prereqs]

- name: Auto-detect DNS servers from system
  ansible.builtin.shell: |
    # VPN DNS (NetBird/WireGuard interface)
    vpn_dns=$(resolvectl status 2>/dev/null | grep -A5 'wt0\|wg0\|tun0' | grep 'DNS Server' | awk '{print $NF}' | head -1)
    # Default gateway DNS (local router)
    home_dns=$(resolvectl status 2>/dev/null | grep -B1 'Default Route: yes' | head -1 | grep -oP 'DNS Servers: \K\S+' || \
               cat /etc/resolv.conf 2>/dev/null | grep '^nameserver' | grep -v '127.0.0' | head -1 | awk '{print $2}')
    # Fallback DNS from resolv.conf
    fallback_dns=$(cat /etc/resolv.conf 2>/dev/null | grep '^nameserver' | grep -v '127.0.0' | tail -1 | awk '{print $2}')
    echo "vpn_dns=${vpn_dns:-8.8.8.8}"
    echo "home_dns=${home_dns:-8.8.8.8}"
    echo "fallback_dns=${fallback_dns:-8.8.4.4}"
  register: dns_detect
  changed_when: false
  tags: [prereqs]

- name: Set DNS facts from auto-detection
  ansible.builtin.set_fact:
    securetty_vpn_dns: "{{ (dns_detect.stdout_lines | select('match', '^vpn_dns=') | first).split('=')[1] }}"
    securetty_home_dns: "{{ (dns_detect.stdout_lines | select('match', '^home_dns=') | first).split('=')[1] }}"
    securetty_fallback_dns: "{{ (dns_detect.stdout_lines | select('match', '^fallback_dns=') | first).split('=')[1] }}"
  when: securetty_vpn_dns is not defined
  tags: [prereqs]

- name: Show detected DNS servers
  ansible.builtin.debug:
    msg: "VPN={{ securetty_vpn_dns }} Home={{ securetty_home_dns }} Fallback={{ securetty_fallback_dns }}"
  tags: [prereqs]

- name: Ensure containers.conf.d directory exists
  ansible.builtin.file:
    path: "{{ securetty_home }}/.config/containers/containers.conf.d"
    state: directory
    mode: "0755"
  tags: [prereqs]

- name: Ensure containers.conf.d directory exists
  ansible.builtin.file:
    path: /etc/containers/containers.conf.d
    state: directory
    mode: "0755"
  become: true
  tags: [prereqs]

- name: Configure rootful podman hooks dir
  ansible.builtin.copy:
    content: |
      [engine]
      hooks_dir = ["{{ securetty_dir }}/hooks"]
    dest: /etc/containers/containers.conf.d/securetty.conf
    mode: "0644"
  become: true
  tags: [prereqs]

- name: Ensure passwordless sudo for podman
  ansible.builtin.copy:
    content: |
      {{ securetty_user }} ALL=(ALL) NOPASSWD: /usr/bin/podman, /usr/bin/podman-compose
    dest: /etc/sudoers.d/securetty-podman
    mode: "0440"
    validate: "visudo -cf %s"
  become: true
  tags: [prereqs]

- name: Ensure podman is installed
  ansible.builtin.dnf:
    name:
      - podman
      - podman-compose
    state: present
  become: true
  tags: [prereqs]

- name: Create agent config directories
  ansible.builtin.file:
    path: "{{ securetty_home }}/{{ item }}"
    state: directory
    owner: "{{ securetty_user }}"
    mode: "0755"
  loop: "{{ securetty_agent_config_dirs }}"
  tags: [prereqs]

- name: Create ~/.claude.json if missing
  ansible.builtin.file:
    path: "{{ securetty_home }}/.claude.json"
    state: touch
    owner: "{{ securetty_user }}"
    mode: "0600"
    modification_time: preserve
    access_time: preserve
  tags: [prereqs]

- name: Validate SSH key exists
  ansible.builtin.stat:
    path: "{{ securetty_home }}/.ssh/{{ securetty_ssh_key }}"
  register: prereqs_ssh_key_stat
  tags: [prereqs]

- name: Fail if SSH key is missing
  ansible.builtin.fail:
    msg: "SSH key not found: {{ securetty_home }}/.ssh/{{ securetty_ssh_key }}"
  when: not prereqs_ssh_key_stat.stat.exists
  tags: [prereqs]

- name: Validate pass entries exist
  ansible.builtin.shell: "pass show '{{ item.path }}' >/dev/null 2>&1"
  loop: "{{ securetty_pass_keys }}"
  loop_control:
    label: "{{ item.var }}"
  register: prereqs_pass_results
  changed_when: false
  failed_when: false
  no_log: true
  tags: [prereqs]

- name: Warn about missing pass entries
  ansible.builtin.debug:
    msg: "WARNING: pass entry '{{ item.item.path }}' for {{ item.item.var }} is missing or unreadable"
  loop: "{{ prereqs_pass_results.results }}"
  loop_control:
    label: "{{ item.item.var }}"
  when: item.rc != 0
  no_log: true
  tags: [prereqs]
