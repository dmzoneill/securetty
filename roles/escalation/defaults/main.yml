---
# Escalation gate defaults
# Controls when securetty halts autonomous agent work and requests human review.
# Override in group_vars/all.yml under the securetty_escalation key.

securetty_escalation:
  # Maximum agentic loop iterations before forcing a stop.
  # Prevents runaway sessions that burn tokens without converging.
  max_turns: 50

  # Wall-clock cap (minutes). Agent is interrupted after this duration
  # regardless of progress.
  max_duration_minutes: 30

  # Minimum test coverage (%) required for the agent to self-merge.
  # Below this threshold the session pauses for human review.
  test_coverage_threshold: 70

  # Maximum lines changed in a single diff. Large diffs are harder to
  # review and more likely to introduce regressions.
  max_diff_lines: 500

  # Glob patterns for files that always require human sign-off.
  # Matches are checked against the list of changed files; any hit
  # triggers an escalation regardless of other gate values.
  high_risk_patterns:
    - "*/auth/*"
    - "*/security/*"
    - "*/crypto/*"
    - "*.key"
    - "*.pem"

  # What happens when a gate trips.
  #   warn  -- print a warning but let the session continue
  #   pause -- stop the agent and prompt the operator for confirmation
  #   abort -- kill the session immediately
  escalation_action: warn
