table inet securetty_egress {
    set allowed_ipv4 {
        type ipv4_addr
        flags interval
    }

    chain forward {
        type filter hook forward priority 0; policy accept;
        ip saddr 10.89.100.0/24 ip daddr @allowed_ipv4 accept
        ip saddr 10.89.100.0/24 ip daddr 100.90.0.0/15 accept
        ip saddr 10.89.100.0/24 ip daddr 10.89.100.1 udp dport 53 accept
        ip saddr 10.89.100.0/24 ip daddr 10.89.100.1 tcp dport 53 accept
        ip saddr 10.89.100.0/24 ct state established,related accept
        ip saddr 10.89.100.0/24 ip daddr 10.89.100.0/24 accept
        ip saddr 10.89.100.0/24 drop
    }
}
